<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Windows Workspace Guard policy decisions</title>
  <desc id="desc">Terminal-style demonstration of safe, approval-required, and hard-blocked commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#e8eef7"/>
  <rect x="54" y="46" width="1092" height="548" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="54" y="46" width="1092" height="58" rx="18" fill="#1f2937"/>
  <rect x="54" y="84" width="1092" height="20" fill="#1f2937"/>
  <circle cx="91" cy="75" r="8" fill="#fb7185"/>
  <circle cx="119" cy="75" r="8" fill="#fbbf24"/>
  <circle cx="147" cy="75" r="8" fill="#34d399"/>
  <text x="600" y="82" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="18">dsh-windows-workspace-guard</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="20">
    <text x="92" y="151" fill="#64748b"># Safe child deletion</text>
    <text x="92" y="185" fill="#e2e8f0">Remove-Item -LiteralPath 'D:\project\builds\old' -Recurse</text>
    <rect x="92" y="205" width="112" height="34" rx="7" fill="#064e3b"/>
    <text x="148" y="229" text-anchor="middle" fill="#6ee7b7" font-weight="700">PASS</text>

    <text x="92" y="292" fill="#64748b"># Shared history rewrite</text>
    <text x="92" y="326" fill="#e2e8f0">git push origin main --force-with-lease</text>
    <rect x="92" y="346" width="148" height="34" rx="7" fill="#78350f"/>
    <text x="166" y="370" text-anchor="middle" fill="#fde68a" font-weight="700">ASK ONCE</text>
    <text x="258" y="370" fill="#94a3b8">git-force-push · HIGH</text>

    <text x="92" y="433" fill="#64748b"># Immutable original media</text>
    <text x="92" y="467" fill="#e2e8f0">Remove-Item -LiteralPath 'D:\project\original\master.zip'</text>
    <rect x="92" y="487" width="172" height="34" rx="7" fill="#7f1d1d"/>
    <text x="178" y="511" text-anchor="middle" fill="#fecaca" font-weight="700">HARD BLOCK</text>
    <text x="282" y="511" fill="#94a3b8">protected-path · CRITICAL</text>
  </g>
  <text x="92" y="561" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="18">Workspace boundaries · one-time approval · append-only audit</text>
</svg>
