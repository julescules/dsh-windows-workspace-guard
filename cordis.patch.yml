# Mounts the out-of-tree plugin through the official dsh.bundle patch mechanism.
- insert:
    - id: windows-workspace-guard
      name: dsh-windows-workspace-guard
      config:
        enabled: true
        mode: block
        toolNames:
          - pwsh
        guardGit: true
        guardSystem: true
        guardProcesses: true
        guardNativeEscapes: true
        guardExistingLinks: true
        guardPersistentShell: true
        requireAbsoluteMutationPaths: true
