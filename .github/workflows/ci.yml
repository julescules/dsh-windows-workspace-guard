name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify policy and package
        run: npm run check
      - name: Inspect packed file allowlist
        run: npm pack --dry-run
      - name: Build and verify release metadata
        shell: pwsh
        run: |
          $package = (npm pack --silent).Trim()
          node scripts/build-release-metadata.mjs $package builds/ci
          ./scripts/verify-release.ps1 -PackagePath $package -ChecksumsPath builds/ci/SHA256SUMS
